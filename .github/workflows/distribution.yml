name: Skill distribution

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install official Agent Skills validator
        run: python -m pip install 'skills-ref @ git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref'
      - name: Run offline tests and assemble distribution
        run: |
          python -m unittest discover -s tests -v
          python scripts/package_skill.py --all dist/bundle
      - name: Validate source and assembled skill formats
        run: |
          for skill in skills/* dist/bundle/skills/*; do
            skills-ref validate "$skill"
          done
      - name: Test installation for Codex and Claude Code
        run: python tests/smoke_install.py dist/bundle
      - name: Archive validated distribution
        run: tar -czf "$RUNNER_TEMP/ops-skills.tar.gz" -C dist/bundle .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ops-skills-distribution
          path: ${{ runner.temp }}/ops-skills.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: publish-skills-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ops-skills-distribution
          path: ${{ runner.temp }}/distribution-artifact
      - name: Publish the validated bundle
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          mkdir "$RUNNER_TEMP/validated-bundle"
          tar -xzf "$RUNNER_TEMP/distribution-artifact/ops-skills.tar.gz" -C "$RUNNER_TEMP/validated-bundle"
          python3 scripts/publish_distribution.py "$RUNNER_TEMP/validated-bundle" --source-commit "$SOURCE_COMMIT"
